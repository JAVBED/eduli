name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained executable
        run: dotnet publish src/eduli.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish
      - name: Smoke test
        shell: pwsh
        run: |
          $executable = if ($IsWindows) { './publish/eduli.exe' } else { './publish/eduli' }
          & $executable help
          if ($LASTEXITCODE -ne 0) { throw 'Help command failed.' }
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE -Destination publish
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          if ($IsWindows) {
            Compress-Archive -Path publish/* -DestinationPath dist/eduli-${{ matrix.rid }}.zip
          } else {
            tar -czf dist/eduli-${{ matrix.rid }}.tar.gz -C publish .
            if ($LASTEXITCODE -ne 0) { throw 'Archive creation failed.' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: eduli-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum eduli-* > SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./* --clobber
          else
            gh release create "$RELEASE_TAG" ./* --verify-tag --generate-notes --title "eduli $RELEASE_TAG"
          fi
